<!-- 지구과학 체험형 시뮬레이션 기본 틀 (skeleton)
  @@FONT_FACE@@ : font/pretendard-kr.woff2 를 base64 로 넣은 @font-face
  @@EMOJI_CSS@@ : 쓰는 이모지마다 .em-<slug>{background-image:url(data:image/png;base64,...)}
  @@LOGO@@      : logo.png 의 data URI,  <title> 과 <h1> 은 직접 씀: 교과명 · 단원번호 단원명 (CLAUDE.md 3장)
  3D 가 필요하면 아래 script 앞에 three.js r128(cdnjs) 를 넣는다. -->

<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*@@FONT_FACE@@*/
/* 레이아웃: 단원 헤더 + 탭 3개. 각 탭은 [시뮬레이션 화면 | 조작 패널] 2단, 좁은 화면에서는 1단 */
:root{
  --bg:#EDF1F2; --panel:#FFFFFF; --ink:#14232D; --muted:#566872; --line:#D2DBDF;
  --accent:#1F6F93; --accent-ink:#FFFFFF; --accent-soft:#DCEBF2;
  --canvas:#F7FAFB; --sky:#E4EEF3;
  --sea:#2E86B3; --sea-a:rgba(46,134,179,.5); --mud:#9B7443; --land:#D3C29C; --land-edge:#8C7A57;
  --grav:#1B2833; --cent:#D9443A; --tide:#1D6BD6; --earth:#3D7F9E; --moon:#AEB4BA;
  --siteC:#D9811A; --siteB:#D9443A; --siteA:#7C5CE6;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E161B; --panel:#152129; --ink:#E2EBEF; --muted:#90A3AD; --line:#2A3A44;
    --accent:#5BB0D6; --accent-ink:#0B1418; --accent-soft:#1B3442;
    --canvas:#111D24; --sky:#142630;
    --sea:#4CA8D4; --sea-a:rgba(76,168,212,.42); --mud:#C2955C; --land:#5B5240; --land-edge:#A08C64;
    --grav:#E2EBEF; --cent:#FF6B5E; --tide:#5AA6FF; --earth:#2F6C88; --moon:#C9CED4;
    --siteC:#F0A33F; --siteB:#FF6B5E; --siteA:#A48BFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E161B; --panel:#152129; --ink:#E2EBEF; --muted:#90A3AD; --line:#2A3A44;
  --accent:#5BB0D6; --accent-ink:#0B1418; --accent-soft:#1B3442;
  --canvas:#111D24; --sky:#142630;
  --sea:#4CA8D4; --sea-a:rgba(76,168,212,.42); --mud:#C2955C; --land:#5B5240; --land-edge:#A08C64;
  --grav:#E2EBEF; --cent:#FF6B5E; --tide:#5AA6FF; --earth:#2F6C88; --moon:#C9CED4;

}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:20px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
h1{font-size:clamp(24px,3.2vw,34px);line-height:1.15;margin:6px 0 0;letter-spacing:-.02em;text-wrap:balance}
.tabs{display:flex;flex-wrap:wrap;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px}
.tabs button{font:500 14px/1.2 var(--font);color:var(--muted);background:transparent;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;display:flex;gap:8px;align-items:center}
.tabs button .n{font:500 12px var(--mono);opacity:.8}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs button:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lab-head{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin-bottom:12px}
.lab-head h2{font-size:21px;margin:0;letter-spacing:-.01em}
.lab-head p{margin:0;color:var(--muted);max-width:70ch}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
@media (max-width:920px){.lab{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.stage canvas{display:block;width:100%;height:auto;border-radius:8px;background:var(--canvas)}
.note{font-size:13px;color:var(--muted);margin:8px 4px 0}
.controls{display:flex;flex-direction:column;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.group{display:flex;flex-direction:column;gap:10px}
.group + .group{border-top:1px solid var(--line);padding-top:14px}
.group h3{margin:0;font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500}
.ctl{display:flex;flex-direction:column;gap:4px}
.ctl .row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.ctl output{font:500 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{font:500 13px/1.2 var(--font);color:var(--ink);background:var(--accent-soft);border:1px solid var(--line);border-radius:8px;padding:8px 11px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:14px}
.checks label{display:flex;gap:7px;align-items:center;cursor:pointer}
.chip{display:inline-block;width:18px;height:4px;border-radius:2px;flex:none}
table.read{width:100%;border-collapse:collapse;font-size:14px}
table.read th,table.read td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
table.read th:first-child,table.read td:first-child{text-align:left}
table.read thead th{font-size:12px;color:var(--muted);font-weight:500}
table.read td{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px}
table.read td:first-child{font-family:var(--font);font-weight:500}
.big{font:500 15px/1.5 var(--font)}
.big b{font-family:var(--mono)}
.formula{font:500 13px var(--mono);background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.qs{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.info{font-size:14px;background:var(--accent-soft);border-radius:8px;padding:10px 12px;min-height:84px}
.info b{font-family:var(--mono);font-weight:500}
.gl-host{position:relative;width:100%;border-radius:8px;overflow:hidden;background:var(--canvas);touch-action:none;cursor:grab;min-height:200px}
.gl-host:active{cursor:grabbing}
.gl-host canvas{display:block}
.gl-clock{position:absolute;left:12px;top:10px;font:500 13px var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;pointer-events:none}
.gl-hint{position:absolute;right:12px;bottom:10px;font-size:12px;color:var(--muted);pointer-events:none}
.gl-error{padding:40px 20px;text-align:center;color:var(--muted)}
.charts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
@media (max-width:760px){.charts{grid-template-columns:minmax(0,1fr)}}
.chart{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.chart-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 8px;font-size:14px;font-weight:500}
.chart-top .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.chart canvas{display:block;width:100%;height:auto;margin-top:4px}
.chart .sub{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.chart .sub b{font-family:var(--mono);font-weight:500;color:var(--ink)}
#cvForce{touch-action:none}
.real{margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}
.real-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:920px){.real-grid{grid-template-columns:minmax(0,1fr)}}
.real figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.real canvas{display:block;width:100%;height:auto;border-radius:8px;background:var(--canvas);touch-action:pan-y}
.real-top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:10px}
.real-top .ctl{flex:1;min-width:180px}
.real-read{font:500 13px var(--mono);margin:8px 4px 0;min-height:1.5em}
.real figcaption{font-size:13px;color:var(--muted);margin:8px 4px 0}
.tide-mini{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.tide-mini-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;font-size:14px;font-weight:500}
.muted-s{font-size:12px;font-weight:400;color:var(--muted)}
.tide-mini canvas{display:block;width:100%;height:auto;margin-top:4px}
.tide-state{display:flex;flex-direction:column;gap:2px;border-radius:10px;padding:12px 14px;background:var(--accent-soft)}
.tide-state b{font-size:22px;letter-spacing:-.01em;color:var(--accent)}
.tide-state span{font-size:14px;color:var(--muted)}
.terms{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:14px}
.terms dt{font-weight:700}
.terms dd{margin:0;color:var(--muted)}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.brand .logo{width:72px;height:auto;flex:none}

@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
.em{display:inline-block;width:1.3em;height:1.3em;background:center/contain no-repeat;vertical-align:-.28em;flex:none}

    <div class="lab">
      <div class="stage">
        <canvas id="cvDemo" width="1000" height="480" style="aspect-ratio:1000/480" aria-label="예시 시뮬레이션"></canvas>
        <p class="note">과장하거나 축척이 다른 부분이 있으면 여기 한 줄로 밝힌다.</p>
      </div>
      <div class="controls t-cards">
        <div class="card">
          <p class="card-title">지금 상태</p>
          <div class="item">
            <div class="tile blue"><i class="em em-water-wave"></i></div>
            <div class="item-text big"><b id="dVal"></b><span>측정값 설명</span></div>
          </div>
        </div>
        <div class="card">
          <div class="ctl"><div class="row"><label for="dAmp">조절 값</label><output id="dAmp-v"></output></div><input type="range" id="dAmp" min="0.2" max="3" step="0.1"></div>
          <div class="pair"><button class="btn">보조 버튼</button><button class="btn">보조 버튼</button></div>
          <button class="btn primary btn-xl" id="dPlay">재생하기</button>
        </div>
        <div class="card">
          <p class="card-title">알아 둘 용어</p>
          <div class="item"><div class="tile"><i class="em em-straight-ruler"></i></div><div class="item-text small"><b>용어</b><span>뜻을 한 줄로</span></div></div>
        </div>
        <div class="card">
          <p class="card-title">생각해 볼 질문 <span class="blue">2개</span></p>
          <p class="card-sub">화면을 직접 움직이며 답을 찾아보세요</p>
          <ol class="qlist">
            <li><span class="num">1</span>질문 1</li>
            <li><span class="num">2</span>질문 2</li>
          </ol>
        </div>
      </div>
    </div>
  </section>
</div>
<script>

(function(){
'use strict';
const $=s=>document.querySelector(s);
const FONT='"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const MONO='"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 색상 토큰 ---------- */
const COL={};
const NAMES=['bg','panel','ink','muted','line','accent','canvas','sky','sea','sea-a','mud','land','land-edge','grav','cent','tide','earth','moon','siteC','siteB','siteA'];
const themeFns=[];
function readColors(){const s=getComputedStyle(document.documentElement);NAMES.forEach(n=>COL[n]=s.getPropertyValue('--'+n).trim());}
function onTheme(){readColors();themeFns.forEach(f=>f());}
readColors();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',onTheme);}catch(e){}
new MutationObserver(onTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- 공통 도구 ---------- */
// 화면이 좁으면 캔버스 글자를 키워 읽기 쉽게 한다
(function(){const d=Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype,'font');if(!d||!d.set)return;
  Object.defineProperty(CanvasRenderingContext2D.prototype,'font',{configurable:true,get(){return d.get.call(this);},
    set(v){const k=this.__fs||1;d.set.call(this,k===1?v:String(v).replace(/(\d+(?:\.\d+)?)px/,(m,n)=>(n*k).toFixed(1)+'px'));}});})();
function fitCanvas(cv,LW,LH){
  const w=cv.clientWidth||LW, dpr=window.devicePixelRatio||1;
  const pw=Math.max(1,Math.round(w*dpr)), ph=Math.max(1,Math.round(w*LH/LW*dpr));
  if(cv.width!==pw||cv.height!==ph){cv.width=pw;cv.height=ph;}
  const ctx=cv.getContext('2d');ctx.setTransform(pw/LW,0,0,ph/LH,0,0);ctx.__fs=Math.min(1.7,Math.max(1,LW/w*0.6));return ctx;
}
function arrow(ctx,x1,y1,x2,y2,color,w,head){
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);if(len<1.5)return;
  head=Math.min(head||11,len*.6);const ux=dx/len,uy=dy/len;
  ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=w;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2-ux*head*.7,y2-uy*head*.7);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-ux*head-uy*head*.5,y2-uy*head+ux*head*.5);ctx.lineTo(x2-ux*head+uy*head*.5,y2-uy*head-ux*head*.5);ctx.closePath();ctx.fill();
}
function bindRange(id,fmt,fn){
  const el=document.getElementById(id),out=document.getElementById(id+'-v');
  const upd=()=>{const v=+el.value;if(out)out.textContent=fmt(v);fn(v);};
  el.addEventListener('input',upd);
  return {el,upd,set(v){el.value=v;upd();}};
}
const logMap=(lo,hi)=>({to:v=>Math.pow(10,Math.log10(lo)+v/1000*(Math.log10(hi)-Math.log10(lo))),from:x=>Math.round((Math.log10(x)-Math.log10(lo))/(Math.log10(hi)-Math.log10(lo))*1000)});
const fmtDeg=d=>d<1?d.toFixed(2)+'°':d<10?d.toFixed(1)+'°':d.toFixed(0)+'°';
function fmtLen(m){if(m>=1000)return (m/1000).toFixed(m>=10000?0:1)+' km';if(m>=10)return Math.round(m)+' m';return m.toFixed(1)+' m';}

/* =========================================================
   예시 탭: demo  (새 단원에서는 이 모듈을 지우고 탭마다 모듈을 만든다)
   모듈 규칙: { show(){}, frame(dt){} } 를 돌려주고, 아래 mods 에 등록한다.
   ========================================================= */
const demo=(function(){
  const cv=$('#cvDemo'),LW=1000,LH=480;
  const st={a:1,playing:!reduce,t:0};
  bindRange('dAmp',v=>v.toFixed(1)+' m',v=>{st.a=v;}).set(1);
  const pb=$('#dPlay');const setPlay=p=>{st.playing=p;pb.textContent=p?'일시정지':'재생하기';};
  pb.onclick=()=>setPlay(!st.playing);setPlay(st.playing);
  function draw(){
    const ctx=fitCanvas(cv,LW,LH);
    const g=ctx.createLinearGradient(0,0,0,LH);g.addColorStop(0,COL.sky);g.addColorStop(1,COL.canvas);ctx.fillStyle=g;ctx.fillRect(0,0,LW,LH);
    const y0=LH/2;ctx.beginPath();
    for(let x=0;x<=LW;x+=4){const y=y0-Math.sin(x/90-st.t*2)*st.a*40;x?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    ctx.lineTo(LW,LH);ctx.lineTo(0,LH);ctx.closePath();ctx.fillStyle=COL['sea-a'];ctx.fill();
    ctx.font=`700 22px ${FONT}`;ctx.fillStyle=COL.ink;ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText('예시 시뮬레이션',18,16);
    $('#dVal').textContent=(Math.sin(-st.t*2)*st.a>=0?'+':'')+(Math.sin(-st.t*2)*st.a).toFixed(1)+' m';
  }
  return {show(){},frame(dt){if(st.playing)st.t+=dt;draw();}};
})();

/* ---------- 탭 & 루프 ---------- */
const mods={demo};const ORDER=Object.keys(mods);let active=ORDER[0];
function setTab(id,save){
  if(!mods[id])id=ORDER[0];active=id;
  document.querySelectorAll('[role=tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===id)));
  ORDER.forEach(k=>{document.getElementById(k).hidden=k!==id;});
  mods[id].show();
  if(save){try{history.replaceState(null,'','#'+id);}catch(e){}}
}
document.querySelectorAll('[role=tab]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab,true)));
setTab((location.hash||'').slice(1)||ORDER[0]);
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;try{mods[active].frame(dt);}catch(e){console.error(e);}requestAnimationFrame(loop);}
requestAnimationFrame(loop);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{onTheme();});
})();
</script>
